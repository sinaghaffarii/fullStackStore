
tags:
  - name: Auth
    description: احراز هویت با پیامک

paths:
  /auth/send-otp:
    post:
      tags: [Auth]
      summary: ارسال کد تایید
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber:
                  type: string
                  example: '09121234567'
      responses:
        200:
          description: کد ارسال شد
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: کد تایید ارسال شد
        400:
          description: شماره نامعتبر
        429:
          description: درخواست زیاد

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: تایید کد و ورود
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, code]
              properties:
                phoneNumber:
                  type: string
                  example: '09121234567'
                code:
                  type: string
                  example: '12345'
      responses:
        200:
          description: ورود موفق
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          phoneNumber:
                            type: string
                          role:
                            type: string
        400:
          description: کد اشتباه یا منقضی
        429:
          description: تلاش بیش از حد

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: تازه‌سازی توکن
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: توکن جدید
        401:
          description: توکن نامعتبر

  /auth/logout:
    post:
      tags: [Auth]
      summary: خروج
      responses:
        200:
          description: خروج موفق

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

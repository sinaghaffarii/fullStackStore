tags:
  - name: Categories
    description: مدیریت دسته‌بندی‌ها

components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        parent_id:
          type: string
          format: uuid
          nullable: true
        sort_order:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    CreateCategoryRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        slug:
          type: string
          minLength: 2
          maxLength: 120
          pattern: '^[-0-9a-z]+$'
        description:
          type: string
          maxLength: 500
        image:
          type: string
          nullable: true
        parent_id:
          type: string
          format: uuid
          nullable: true
        sort_order:
          type: integer
          minimum: 0
        is_active:
          type: boolean
          default: true

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        image:
          type: string
          nullable: true
        parent_id:
          type: string
          format: uuid
          nullable: true
        sort_order:
          type: integer
        is_active:
          type: boolean

paths:
  /categories:
    get:
      tags: [Categories]
      summary: لیست دسته‌بندی‌ها
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: include_children
          schema:
            type: boolean
            default: false
        - in: query
          name: parent_id
          schema:
            type: string
            format: uuid
        - in: query
          name: is_active
          schema:
            type: boolean
        - in: query
          name: search
          schema:
            type: string
      responses:
        200:
          description: Success

    post:
      tags: [Categories]
      summary: ایجاد دسته‌بندی
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        201:
          description: Created

  /categories/hierarchy:
    get:
      tags: [Categories]
      summary: ساختار درختی
      responses:
        200:
          description: Success

  /categories/search:
    get:
      tags: [Categories]
      summary: جستجو
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success

  /categories/{id}:
    get:
      tags: [Categories]
      summary: جزئیات دسته‌بندی
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Success

    put:
      tags: [Categories]
      summary: ویرایش
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        200:
          description: Updated

    delete:
      tags: [Categories]
      summary: حذف
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Deleted

  /categories/{id}/subcategories:
    get:
      tags: [Categories]
      summary: زیردسته‌ها
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Success

  /categories/{id}/breadcrumb:
    get:
      tags: [Categories]
      summary: مسیر breadcrumb
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Success

  /categories/{id}/slug-path:
    get:
      tags: [Categories]
      summary: مسیر کامل slug
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Success

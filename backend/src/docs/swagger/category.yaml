tags:
  - name: Categories
    description: مدیریت دسته‌بندی‌ها

components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        is_active:
          type: boolean
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'

paths:
  /categories:
    get:
      tags: [Categories]
      summary: لیست دسته‌بندی‌ها
      responses:
        200:
          description: Success

    post:
      tags: [Categories]
      summary: ایجاد دسته‌بندی
      security:
        - bearerAuth: []
      responses:
        201:
          description: Created

  /categories/hierarchy:
    get:
      tags: [Categories]
      summary: ساختار درختی دسته‌بندی‌ها
      responses:
        200:
          description: Success

  /categories/{id}:
    put:
      tags: [Categories]
      summary: ویرایش دسته‌بندی
      security:
        - bearerAuth: []
      responses:
        200:
          description: Updated

    delete:
      tags: [Categories]
      summary: حذف دسته‌بندی
      security:
        - bearerAuth: []
      responses:
        200:
          description: Deleted

tags:
  - name: Discounts
    description: مدیریت تخفیف‌ها

paths:
  /discounts:
    get:
      tags: [Discounts]
      summary: لیست تخفیف‌ها
      security:
        - bearerAuth: []
      parameters:
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: validOnly
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        200:
          description: Success

    post:
      tags: [Discounts]
      summary: ایجاد تخفیف
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, coupon_code, type, value, starts_at, ends_at]
              properties:
                name:
                  type: string
                coupon_code:
                  type: string
                type:
                  type: string
                  enum: [PERCENTAGE, FIXED]
                value:
                  type: number
                max_amount:
                  type: number
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                badge_text:
                  type: string
                is_active:
                  type: boolean
      responses:
        200:
          description: Success

  /discounts/banners:
    get:
      tags: [Discounts]
      summary: تخفیف‌های فعال (بنر)
      responses:
        200:
          description: Success

  /discounts/{id}:
    get:
      tags: [Discounts]
      summary: دریافت تخفیف
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Success

    put:
      tags: [Discounts]
      summary: ویرایش تخفیف
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                coupon_code:
                  type: string
                type:
                  type: string
                  enum: [PERCENTAGE, FIXED]
                value:
                  type: number
                max_amount:
                  type: number
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                badge_text:
                  type: string
                is_active:
                  type: boolean
      responses:
        200:
          description: Success

    delete:
      tags: [Discounts]
      summary: حذف تخفیف
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Success

  /discounts/{id}/toggle:
    patch:
      tags: [Discounts]
      summary: تغییر وضعیت فعال/غیرفعال
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Success

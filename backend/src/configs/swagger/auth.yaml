tags:
  - name: Auth
    description: احراز هویت و مدیریت نشست‌ها
  - name: Admin Management
    description: مدیریت ادمین‌ها (فقط SuperAdmin)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
          enum: [customer, admin, super-admin]
        isActive:
          type: boolean
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceInfo:
          type: string
        ipAddress:
          type: string
        createdAt:
          type: string
          format: date-time

    AdminCreate:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    AdminUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        is_active:
          type: boolean

paths:
  # ==================== Customer Auth ====================

  /auth/send-otp:
    post:
      tags: [Auth]
      summary: ارسال کد تأیید
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber:
                  type: string
                  example: '09121234567'
      responses:
        200:
          description: کد تأیید ارسال شد

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: تأیید کد و ورود
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, code]
              properties:
                phoneNumber:
                  type: string
                code:
                  type: string
      responses:
        200:
          description: ورود موفق

  # ==================== Admin Auth ====================

  /auth/admin/login:
    post:
      tags: [Auth]
      summary: ورود ادمین
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        200:
          description: ورود موفق
        401:
          description: نام کاربری یا رمز عبور اشتباه
        403:
          description: حساب غیرفعال است

  /auth/admin/me:
    get:
      tags: [Auth]
      summary: اطلاعات ادمین فعلی
      security:
        - cookieAuth: []
      responses:
        200:
          description: اطلاعات ادمین
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'

  # ==================== Admin Management ====================

  /auth/admin/create:
    post:
      tags: [Admin Management]
      summary: ایجاد ادمین جدید
      description: فقط SuperAdmin می‌تواند ادمین جدید ایجاد کند
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreate'
      responses:
        201:
          description: ادمین با موفقیت ایجاد شد
        403:
          description: عدم دسترسی
        409:
          description: نام کاربری یا ایمیل تکراری

  /auth/admin/list:
    get:
      tags: [Admin Management]
      summary: لیست همه ادمین‌ها
      description: فقط SuperAdmin می‌تواند لیست ادمین‌ها را ببیند
      security:
        - cookieAuth: []
      responses:
        200:
          description: لیست ادمین‌ها

  /auth/admin/{adminId}:
    get:
      tags: [Admin Management]
      summary: دریافت اطلاعات یک ادمین
      security:
        - cookieAuth: []
      parameters:
        - name: adminId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: اطلاعات ادمین
        404:
          description: ادمین یافت نشد

    put:
      tags: [Admin Management]
      summary: بروزرسانی اطلاعات ادمین
      security:
        - cookieAuth: []
      parameters:
        - name: adminId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdate'
      responses:
        200:
          description: ادمین بروزرسانی شد
        403:
          description: نمی‌توانید SuperAdmin را ویرایش کنید

  /auth/admin/{adminId}/toggle-status:
    patch:
      tags: [Admin Management]
      summary: تغییر وضعیت ادمین (فعال/غیرفعال)
      description: |
        این endpoint وضعیت فعلی ادمین را چک کرده و برعکس آن را اعمال می‌کند:
        - اگر فعال است → غیرفعال می‌شود
        - اگر غیرفعال است → فعال می‌شود
      security:
        - cookieAuth: []
      parameters:
        - name: adminId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: وضعیت ادمین تغییر کرد
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: 'ادمین با موفقیت غیرفعال شد'
                  data:
                    type: object
                    properties:
                      admin:
                        $ref: '#/components/schemas/User'
        403:
          description: نمی‌توانید وضعیت SuperAdmin را تغییر دهید
        404:
          description: ادمین یافت نشد
  # ==================== Token Management ====================

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: تازه‌سازی توکن
      responses:
        200:
          description: توکن تازه‌سازی شد

  /auth/logout:
    post:
      tags: [Auth]
      summary: خروج
      security:
        - cookieAuth: []
      responses:
        200:
          description: خروج موفق

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: خروج از همه دستگاه‌ها
      security:
        - cookieAuth: []
      responses:
        200:
          description: از همه دستگاه‌ها خارج شدید

  # ==================== User Info ====================

  /auth/me:
    get:
      tags: [Auth]
      summary: اطلاعات کاربر فعلی
      security:
        - cookieAuth: []
      responses:
        200:
          description: اطلاعات کاربر

  # ==================== Session Management ====================

  /auth/sessions:
    get:
      tags: [Auth]
      summary: لیست نشست‌های فعال
      security:
        - cookieAuth: []
      responses:
        200:
          description: لیست نشست‌ها

  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: بستن نشست
      security:
        - cookieAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: نشست بسته شد
